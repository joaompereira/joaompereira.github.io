name: Update Calendar

on:
  schedule:
    - cron: '0 * * * *'   # Hourly at minute 0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file
        run: |
          curl -L \
            "https://calendar.google.com/calendar/ical/ank2pdmcsvuanuimgn4mmfoqtiilbjbs%40import.calendar.google.com/public/basic.ics" \
            -o uploads/apmath_calendar.ics

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          current = Path("uploads/apmath_calendar.ics").read_text(errors="ignore")

          try:
              previous = subprocess.check_output(
                  ["git", "show", "HEAD:uploads/apmath_calendar.ics"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              previous = ""

          def normalize(text):
              # Ignore DTSTAMP lines
              lines = [
                  line for line in text.splitlines()
                  if not line.startswith("DTSTAMP:")
              ]

              text = "\n".join(lines)

              # Extract and sort VEVENT blocks
              events = re.findall(
                  r"BEGIN:VEVENT.*?END:VEVENT",
                  text,
                  flags=re.DOTALL
              )

              return "\n\n".join(sorted(events))

          if normalize(previous) == normalize(current):
              print("No meaningful changes detected")
              sys.exit(0)

          sys.exit(1)
          PY

          if [ $? -eq 0 ]; then
            exit 0
          fi

          git add uploads/apmath_calendar.ics
          git commit -m "Update calendar"
          git push
